services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workflows
    ports:
      - '5432:5432'
  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - '7233:7233'
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_USER: user
      POSTGRES_PWD: password
      POSTGRES_SEEDS: postgres
      TEMPORAL_CLI_ADDRESS: 'temporal:7233'
      TEMPORAL_CLI_PORT: '7233'
    depends_on:
      - postgres
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - '8080:8080'
    environment:
      TEMPORAL_ADDRESS: 'temporal:7233'
    depends_on:
      - temporal
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      TEMPORAL_ADDRESS: 'temporal:7233'
      # Shorten the human-step timers for local demos, e.g. CONTRACT_REMINDER_DELAY="30 seconds".
      # Empty = production defaults (3 days / 4 more days / 1 day before start).
      CONTRACT_REMINDER_DELAY: '${CONTRACT_REMINDER_DELAY:-}'
      CONTRACT_ESCALATION_DELAY: '${CONTRACT_ESCALATION_DELAY:-}'
      WELCOME_LEAD_TIME: '${WELCOME_LEAD_TIME:-}'
    depends_on:
      - postgres
      - temporal
    restart: on-failure:10
  worker:
    build: .
    command: ['node', 'dist/worker']
    environment:
      TEMPORAL_ADDRESS: 'temporal:7233'
      # Probability (0-1) that a mocked external call fails, to exercise retries.
      MOCK_FAILURE_RATE: '${MOCK_FAILURE_RATE:-0}'
    depends_on:
      - postgres
      - temporal
    restart: on-failure:10
